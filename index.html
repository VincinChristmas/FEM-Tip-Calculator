<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="stylesheet" href="/styles/main.css">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Tip calculator app</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
  <main>
    <header>
      <img src="/images/logo.svg" alt="logo">
    </header>
    <div class="container">
<div class="calculator">
  <!-- Bill Entrance Section-->
  <div class="bill">
    <label for="bill">Bill</label>
    <div class="input-wrapper">
      <img src="/images/icon-dollar.svg" alt="" class="input-icon">
      <input type="number" id="bill" placeholder="0">
    </div>
  </div>

  <!-- Tip Selection Section-->
   <div class="tip">
    <label for="tip">Select Tip %</label>
    <div class="tip-buttons">
      <button class="tip-button">5%</button>
      <button class="tip-button">10%</button>
      <button class="tip-button">15%</button>
      <button class="tip-button">25%</button>
      <button class="tip-button">50%</button>
      <button class="tip-button">Custom</button>
    </div>
   </div>
    
  
    
    Number of People
  
    Tip Amount
    / person
  
    Total
    / person
  
    Reset


</div>
  

  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer>
  </div>
  </main>
</body>
</html>
